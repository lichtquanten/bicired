components:
  day:
    type: object
    label: Day
    fields:
      - name: times
        label: Times
        type: string

content:
  - name: announcements
    label: Announcements
    type: file
    path: src/_data/announcements.json
    fields:
      - name: closure
        label: Closure
        type: boolean
  - name: hours
    label: Hours
    type: file
    path: src/_data/hours.json
    fields:
      - name: monday
        label: Monday
        component: day
      - name: tuesday
        label: Tuesday
        component: day
      - name: wednesday
        label: Wednesday
        component: day
      - name: thursday
        label: Thursday
        component: day
      - name: friday
        label: Friday
        component: day
      - name: saturday
        label: Saturday
        component: day
      - name: sunday
        label: Sunday
        component: day

  - name: bigimportant
    label: Big Important
    type: file
    path: src/bindex.html
    format: code