content:
  - name: hours-en-US
    label: Hours (English)
    type: file
    path: src/content/en-US/hours.md
    fields:
      - name: body
        type: rich-text
  - name: hours-es-US
    label: Hours (Spanish)
    type: file
    path: src/content/es-US/hours.md
    fields:
      - name: body
        type: rich-text
  - name: announcements
    label: Announcements
    type: file
    path: src/_data/announcements.json
    fields:
      - name: closure
        label: Closure
        type: boolean
  - name: key-pages
    label: Key Pages
    type: file
    list: true
    path: src/_data/key-pages.json
    fields:
      - name: slug
        label: Slug
        type: string
      - name: label
        label: Label
        type: string
  - name: site-en
    label: Site (English)
    type: collection
    path: src/content/en-US
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
  - name: site-es
    label: Site (Spanish)
    type: collection
    path: src/content/es-US
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text