components:
  day:
    type: object
    label: Day
    fields:
      - name: times
        label: Times
        type: string

content:
  - name: announcements
    label: Announcements
    type: file
    path: src/_data/announcements.json
    fields:
      - name: closure
        label: Closure
        type: boolean
  - name: hours
    label: Hours
    type: file
    path: src/_data/hours.json
    fields:
      - name: days
        label: Days
        type: object
        list: true
        fields:
          - { name: day, label: Day, type: string }
          - { name: hours, label: Hours, type: string }
  - name: bigimportant
    label: Big Important
    type: file
    path: src/bindex.html
    format: code