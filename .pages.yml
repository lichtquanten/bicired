content:
  - name: hours-en-US
    label: Hours (English)
    type: file
    path: src/content/en-US/hours.md
    fields:
      - name: body
        type: rich-text
  - name: hours-es-US
    label: Hours (Spanish)
    type: file
    path: src/content/es-US/hours.md
    fields:
      - name: body
        type: rich-text
  - name: announcements
    label: Announcements
    type: file
    path: src/_data/announcements.json
    fields:
      - name: closure
        label: Closure
        type: boolean
  - name: key-pages
    label: Key Pages
    type: file
    list: true
    path: src/_data/key-pages-titles.json
    fields:
      - name: "en-US"
        label: Title (English)
        type: string
        required: true
      - name: "es-US"
        label: Title (Spanish)
        type: string
        required: true
  - name: site-en
    label: Site (English)
    type: collection
    path: src/content/en-US
    filename: "{title}.md"
    view:
      fields: [title]
      primary: title
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        type: rich-text
        label: Body
  - name: site-es
    label: Site (Spanish)
    type: collection
    path: src/content/es-US
    filename: "{title}.md"
    view:
      fields: [title]
      primary: title
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        type: rich-text
        label: Body
