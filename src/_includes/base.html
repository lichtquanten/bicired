<!doctype html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="DIY/DIT bicycle repair co-op in Los Angeles">
    <!-- <link rel="stylesheet" href="/css/concrete.css"> -->
    <link rel="stylesheet" href="/css/simple.css">
<!-- <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
> -->
    <title>{{ title }}</title>
</head>

<body>
    <header>
            <h1>Bicycle Kitchen</h1>
            <img style="filter: invert(var(--inversion)); max-width: 4rem" src="/img/logo.png" alt="yo" width="10px">
            <nav>
                <ul>
                    <li>
                        <img style="max-width:2rem" src="/img/bike.png" alt="Poorly drawn bicycle" >
                    </li>
                <li>
                    <a href="/">
                        Home
                    </a>
                </li>
                <li>
                    <a href="/about">
                        About
                    </a>
                </li>
                <li>
                    <a href="/volunteer">
                        Volunteer
                    </a>
                </li>
                <li>
                    <a href="/donate">
                        Donate
                    </a>
                </li>
                    <li>
                        <img style="max-width:2rem" src="/img/wrench.png" alt="Poorly drawn wrench" >
                    </li>
                </ul>
            </nav>
            <div style="display: flex; justify-content: center">
                <img style="margin: 0; padding: 0; flex-shrink: 1; flex-grow: 0; min-width: 0; max-width:2rem" src="/img/wrench.png" alt="yo" width="10px">
            </div>
        <hr>
    </header>
    <main>
        {{ content }}
    </main>
    <footer>
        <h1>
            Contact Us
        </h1>
            <p>Email: <a href="mailto:kitchen@bicyclekitchen.com">kitchen@bicyclekitchen.com</a></p>
            <p>Phone: <a href="tel:+13236622776">(323) 662-2776</a></p>
            <p>Instagram: <a href="https://www.instagram.com/bicicocina">@bicicocina</a></p>
            <p>Directions: <a href="geo:34.0959335,-118.2862270">4429 Fountain Ave, Los Angeles, CA 90029</a></p>
    </footer>
</body>

</html>
