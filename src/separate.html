<!doctype html>
<html>
<header lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="DIY/DIT bicycle repair co-op in Los Angeles">
    <title>Bicycle Kitchen</title>
</header>

<body>
    <main>
        <p>Hi from Bicycle Kitchen</p>
        {% for day in hours["hours"] %}
        <p>{{ day.day }}: {{ day.hours }}
            {% if day.note %}
                (<i>{{ day.note }}</i>)
            {% endif %}
            </p>
        {% endfor %}
    </main>
</body>

</html>
